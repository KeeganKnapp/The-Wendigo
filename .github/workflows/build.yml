name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR so pushes don't queue up stale builds.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tasks.withType(JavaCompile).configureEach { it.options.release = 25 } in build.gradle -
      # keep this in sync with that if the project's target release ever changes.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileJava compileGametestJava --no-daemon

      - name: Run GameTests
        run: ./gradlew runGameTest --no-daemon

      - name: Build jar
        run: ./gradlew build -x test --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: wendigo-jar
          path: build/libs/*.jar
          if-no-files-found: error
