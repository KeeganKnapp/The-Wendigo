plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = 'Nucleoid (Polymer)'
		url = 'https://maven.nucleoid.xyz/'
	}
	mavenCentral()
}

// A dedicated configuration for the Anthropic Java SDK - see its own dependencies{} entry below
// for why this can't just be a plain include(implementation(...)) line like the polymer-*
// dependencies use. Its full resolved graph gets walked in the afterEvaluate block at the bottom
// of this file, which include()s every one of those artifacts individually (so a future SDK
// version bump can't silently drop a newly-added transitive the way a hand-written list would).
configurations {
	anthropicShade
}
configurations.implementation.extendsFrom(configurations.anthropicShade)

loom {
	splitEnvironmentSourceSets()

	// Widens a handful of protected vanilla fields (Mob.moveControl/lookControl/jumpControl,
	// Entity.xRot/yRot) that AWCAPI's ClimberComponent needs direct access to - see
	// wendigo.accesswidener's own comment for why this has to live here rather than coming
	// for free from AWCAPI's own jar.
	accessWidenerPath = file("src/main/resources/wendigo.accesswidener")

	mods {
		"wendigo" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Enables `./gradlew runGameTest` - a headless server run that discovers every @GameTest-annotated
// method on the classpath and runs it against a scratch world, then exits with a pass/fail summary.
// Lets automated scenarios (spawn a mock ServerPlayer via GameTestHelper, position/equip/pose it,
// trigger a wave, assert on outcome) run without a real client ever connecting - see
// src/gametest/java/com/wendigo/gametest. eula=true because the gametest task boots a real (if
// scratch, throwaway) game server under the hood, same as any other server launch.
fabricApi {
	configureTests {
		eula = true
		enableGameTests = true
		// A dedicated source set (src/gametest/java, with its own fabric.mod.json - see
		// src/gametest/resources) rather than dropping test code into main - keeps @GameTest-
		// annotated scenarios out of the actual shipped mod jar entirely. Deliberately its own
		// separate mod id (not "wendigo") - configureTests' own modId option instead tries to
		// register "wendigo" a second time under this source set, colliding with the loom.mods{}
		// declaration below. The gametest mod just depends on wendigo (see its own fabric.mod.json)
		// for classpath access to its classes, same as any other mod-on-mod dependency.
		createSourceSet = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Polymer: lets us drive a virtual item-display rig + push a resource pack to fully
	// vanilla clients, with no client-side mod required. This Loom version has no
	// modImplementation/modApi configurations (mod remapping is transparent now), so these
	// are plain `implementation`, wrapped in include() to bundle Polymer into our jar so
	// server admins don't need to separately install it.
	include(implementation("eu.pb4:polymer-core:${project.polymer_version}"))
	include(implementation("eu.pb4:polymer-virtual-entity:${project.polymer_version}"))
	include(implementation("eu.pb4:polymer-resource-pack:${project.polymer_version}"))

	// Anthropic Java SDK - drives the wendigo's decision plans (see com.wendigo.llm).
	// anthropicShade, not a plain include(implementation(...)) line: this SDK's real dependency
	// graph is far deeper than just itself - OkHttp, Jackson (databind/datatype-jdk8/jsr310/
	// module-kotlin), Kotlin stdlib, Apache HttpComponents 5, victools jsonschema-generator (+
	// its jackson/swagger modules), slf4j-api, and a few smaller ones (confirmed via `gradlew
	// dependencies` - the anthropic-java artifact ITSELF is a ~350-byte empty aggregator POM-jar
	// with zero real classes). include(implementation(...)) only nests the ONE literal artifact
	// you wrap, not that artifact's own transitive deps (confirmed empirically), so every one of
	// those ~25 real jars needs its own individual include() entry for Loom to actually bundle
	// it - see the afterEvaluate block at the bottom of this file, which does that
	// programmatically off this configuration's own fully-resolved graph instead of a
	// hand-maintained list.
	//
	// slf4j-api excluded deliberately: confirmed via `gradlew dependencies` that Fabric/Minecraft
	// itself already directly depends on org.slf4j:slf4j-api (paired with its own
	// log4j-slf4j2-impl logging bridge) at 2.0.17 - the version every OTHER slf4j-api request in
	// the whole project's graph gets conflict-resolved up to. anthropicShade resolves in
	// isolation from that project-wide resolution, so left unexcluded it nested a stale
	// 2.0.16 copy instead - a real, if probably-harmless-in-practice, version mismatch against
	// what the rest of the mod (and Fabric itself) actually uses. Excluding it here means the
	// mod links against the one real copy Fabric/Minecraft already guarantees is present, same
	// as every other library shouldn't re-bundle a logging facade its host platform already owns.
	anthropicShade("com.anthropic:anthropic-java:2.34.0") {
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}

	// Advanced Wall Climber API (AWCAPI, by Nyfaria: https://nyfaria.com/docs) - real spider-style
	// wall/ceiling climbing physics + pathfinding, used by WendigoEntity for wall/ceiling movement.
	// Deliberately NOT include()'d: AWCAPI's license explicitly forbids embedding its jar - it must
	// stay a real, separately-installed server-side mod dependency (see fabric.mod.json's "awcapi"
	// entry in `depends`), same as any server admin installing two mods side by side.
	// This is a local jar, not a Maven coordinate: AWCAPI's public repo (maven.100media.dev) only
	// publishes builds up to MC 1.21.1 - nothing for this project's 26.1.2 line yet. The jar in
	// libs/ was extracted (unmodified) from the awcapi-fabric-26.1-1.0.1.jar nested inside
	// nyfsspiders-fabric-26.1-3.0.0.jar (which itself ships awcapi as a Fabric nested jar) -
	// already mapped to Mojang "official" names (verified via its own META-INF/MANIFEST.MF), so no
	// remapping step is needed. Swap this for a real Maven coordinate once AWCAPI publishes a
	// 26.1.2 build.
	implementation files('libs/awcapi-fabric-26.1-1.0.1.jar')

	// Stormy's Spiders (by Halfstorm: https://modrinth.com/mod/stormies-spiders) - a SEPARATE,
	// independent (non-AWCAPI) climbing-mob implementation, used ONLY by the debug spider-summoner
	// item (see com.wendigo.debug.SpiderDiagnostics/WendigoDebugItems) for a live wendigo-vs-spider
	// comparison test. Unlike AWCAPI above, this is NOT a real runtime dependency of the wendigo
	// itself - it's not declared in fabric.mod.json's depends, and every other class in this mod
	// works fine without it installed.
	// compileOnly, not implementation: this exact jar is ALREADY separately installed in this dev
	// instance's own run/mods/ folder (the real, actually-loaded copy Fabric Loader resolves at
	// runtime, matching AWCAPI's "separately-installed mod" precedent below). Adding it a SECOND
	// time via `implementation` put two copies on the runtime classpath and broke Fabric Loader's own
	// mod resolution outright (confirmed live: "HARD_DEP_NO_CANDIDATE stormiespiders" / mods
	// incompatible errors on every run/gameTest launch) - compileOnly keeps it off the runtime
	// classpath entirely while still letting this mod's own code compile against its types (see
	// SpiderDiagnostics' own IClimberEntity/Orientation usage), with run/mods/ providing the one real
	// copy Fabric Loader actually loads. On a machine without that separate install, only the two
	// debug classes that import its types would fail (NoClassDefFoundError, only when someone
	// actually uses the spider-summoner item) - acceptable for a dev-only testing tool used
	// exclusively on an instance that already has both mods installed together anyway. Deliberately
	// NOT include()'d, same reasoning as AWCAPI: its LGPL v2.1 license permits linking against it as a
	// separately-installed mod, not bundling/redistributing its own code inside this jar. Local jar,
	// not a Maven coordinate: mirrors run/mods/stormiespiders-fabric-26.1-3.3.0.jar exactly, copied
	// unmodified into libs/ purely so the compileOnly reference has a stable path independent of
	// whatever happens to be in run/mods/ at any given moment.
	compileOnly files('libs/stormiespiders-fabric-26.1-3.3.0.jar')
}

// See anthropicShade's own comment above - walks its fully-resolved dependency graph (only
// available after the configuration is actually resolved, hence afterEvaluate) and adds every
// resolved artifact to Loom's own "include" configuration individually, so each one gets nested
// into the built jar under META-INF/jars/ the same way the polymer-* dependencies already are.
afterEvaluate {
	configurations.anthropicShade.resolvedConfiguration.resolvedArtifacts.each { artifact ->
		def id = artifact.moduleVersion.id
		dependencies.add('include', "${id.group}:${id.name}:${id.version}")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// --debug-jvm's default JDWP bind (address=5005, no host) only trusts loopback
// peers. Through the sandbox container's port-forwarding, connections from the
// host don't look like they came from the container's own loopback, so the JVM
// resets them. Binding on all interfaces avoids that without opening a host port.
tasks.named('runClient') {
	debugOptions {
		host = '*'
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
